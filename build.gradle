ext {
    
    versionInfo = new Properties()
    versionInfo.load(new FileInputStream(rootProject.projectDir.getPath() + '/ide/src/main/resources/version.properties'))
}

//String versionString = versionInfo.majorVersion + '.' + versionInfo.minorVersion + '.' + versionInfo.buildVersion + '.' + versionInfo.revisionVersion
String versionString = versionInfo.majorVersion + '.' + versionInfo.minorVersion + '.' + versionInfo.buildVersion

if (versionInfo.releaseName != null && !versionInfo.releaseName.trim().isEmpty()) {
    versionString = versionString + '-' + versionInfo.releaseName.trim()
}


group = versionInfo.mavenGroupId

version = versionString

// macOS File Provider/iCloud can duplicate files while javac is writing inside
// Documents. Allow builds to be redirected to a local temporary volume.
def externalBuildRoot = providers.gradleProperty('portugolBuildRoot')
        .orElse(providers.environmentVariable('PORTUGOL_BUILD_ROOT'))
        .orNull

if (externalBuildRoot) {
    layout.buildDirectory = file("${externalBuildRoot}/root")
}

apply plugin: 'base'

subprojects {
    if (externalBuildRoot) {
        layout.buildDirectory = file("${externalBuildRoot}/${name}")
    }
    
    apply from: rootProject.file('projects.gradle')
}

tasks.register('mergedJavadoc', Javadoc) {
    description = 'Creates Javadoc from all the projects.'
    title = 'All modules'
    destinationDir = layout.buildDirectory.dir('merged-javadoc').get().asFile

    // Note: The closures below are executed lazily.
    source {
       subprojects*.sourceSets*.main*.allSource
    }
    classpath.from(subprojects.collect { it.sourceSets.main.compileClasspath })
}



tasks.named('clean') {
    dependsOn(subprojects.collect { it.tasks.named('clean') })
}

tasks.named('build') {
    dependsOn(subprojects.collect { it.tasks.named('build') })
}

apply from: rootProject.file('macos.gradle')
